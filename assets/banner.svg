<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a10" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Animated Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes pulseGlow1 {
        0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.35; }
        50% { transform: translate(40px, 20px) scale(1.15); opacity: 0.55; }
      }
      @keyframes pulseGlow2 {
        0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.3; }
        50% { transform: translate(-30px, -25px) scale(1.2); opacity: 0.5; }
      }
      @keyframes floatParticle {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(180deg); }
      }
      @keyframes dashStream {
        0% { stroke-dashoffset: 60; }
        100% { stroke-dashoffset: 0; }
      }
      .glow-orb-1 {
        animation: pulseGlow1 8s ease-in-out infinite;
        transform-origin: 250px 180px;
      }
      .glow-orb-2 {
        animation: pulseGlow2 10s ease-in-out infinite;
        transform-origin: 950px 220px;
      }
      .flow-line {
        stroke-dasharray: 6 10;
        animation: dashStream 3s linear infinite;
      }
      .floating-tag {
        animation: floatParticle 6s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="20" fill="url(#bgGrad)" />

  <!-- Subtle Blueprint Tech Grid -->
  <g stroke="#334155" stroke-opacity="0.25" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="150" y1="0" x2="150" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="450" y1="0" x2="450" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="750" y1="0" x2="750" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1050" y1="0" x2="1050" y2="420" />
  </g>

  <!-- Ambient Dynamic Orbs in Background (Never hides foreground text) -->
  <g style="mix-blend-mode: screen;">
    <circle class="glow-orb-1" cx="220" cy="160" r="140" fill="#38bdf8" filter="url(#glow)" />
    <circle class="glow-orb-2" cx="980" cy="220" r="160" fill="#a855f7" filter="url(#glow)" />
    <circle cx="600" cy="380" r="180" fill="#6366f1" opacity="0.2" filter="url(#glow)" />
  </g>

  <!-- Dynamic Animated Tech Stream Lines -->
  <path class="flow-line" d="M 50,330 Q 300,380 600,330 T 1150,340" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.6" />
  <path class="flow-line" d="M 80,350 Q 350,300 650,360 T 1120,310" fill="none" stroke="#c084fc" stroke-width="2" opacity="0.4" />

  <!-- Corner Border accents -->
  <path d="M 30,60 L 30,30 L 60,30" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.8" />
  <path d="M 1170,60 L 1170,30 L 1140,30" fill="none" stroke="#c084fc" stroke-width="2.5" opacity="0.8" />
  <path d="M 30,360 L 30,390 L 60,390" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.8" />
  <path d="M 1170,360 L 1170,390 L 1140,390" fill="none" stroke="#c084fc" stroke-width="2.5" opacity="0.8" />

  <!-- Floating Dynamic Tech Cards / Badges (in sides, ensuring center title remains crisp) -->
  <g class="floating-tag" transform="translate(100, 70)">
    <rect width="140" height="36" rx="18" fill="url(#badgeGrad)" stroke="#38bdf8" stroke-width="1.2" opacity="0.85" />
    <circle cx="20" cy="18" r="5" fill="#38bdf8" />
    <text x="35" y="23" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">☁️ CLOUD POS</text>
  </g>

  <g class="floating-tag" style="animation-delay: -3s;" transform="translate(960, 65)">
    <rect width="150" height="36" rx="18" fill="url(#badgeGrad)" stroke="#c084fc" stroke-width="1.2" opacity="0.85" />
    <circle cx="20" cy="18" r="5" fill="#c084fc" />
    <text x="35" y="23" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">⚡ HEADLESS API</text>
  </g>

  <!-- FOREGROUND CONTENT: Header Category Tag -->
  <g transform="translate(600, 85)">
    <rect x="-170" y="-18" width="340" height="36" rx="18" fill="#1e293b" stroke="#6366f1" stroke-width="1.5" />
    <text x="0" y="6" text-anchor="middle" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2">🛒 AWESOME CURATED ARCHITECTURE</text>
  </g>

  <!-- FOREGROUND CONTENT: Main Title -->
  <text x="600" y="165" text-anchor="middle" fill="url(#accentGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5">
    Cloud Storefront &amp; Retail Platforms
  </text>

  <!-- FOREGROUND CONTENT: Subtitle -->
  <text x="600" y="215" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="500">
    The Complete Directory of Enterprise Cloud SaaS &amp; High-Star Open-Source Commerce Engines
  </text>

  <!-- FOREGROUND CONTENT: Feature Pills -->
  <g transform="translate(600, 275)">
    <!-- Pill 1: Headless Commerce -->
    <g transform="translate(-320, 0)">
      <rect x="-85" y="-16" width="170" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="0" y="5" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">🚀 Headless Commerce</text>
    </g>
    <!-- Pill 2: Omnichannel Retail -->
    <g transform="translate(-105, 0)">
      <rect x="-85" y="-16" width="170" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="0" y="5" text-anchor="middle" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">🛍️ Omnichannel POS</text>
    </g>
    <!-- Pill 3: Composable APIs -->
    <g transform="translate(105, 0)">
      <rect x="-85" y="-16" width="170" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="0" y="5" text-anchor="middle" fill="#a78bfa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">🔌 GraphQL &amp; REST</text>
    </g>
    <!-- Pill 4: Open Source Freedom -->
    <g transform="translate(320, 0)">
      <rect x="-85" y="-16" width="170" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="0" y="5" text-anchor="middle" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">🔓 100% Data Control</text>
    </g>
  </g>

  <!-- Bottom Accent Status Bar -->
  <g transform="translate(600, 360)">
    <text x="0" y="0" text-anchor="middle" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500">
      ⚡ Up-to-Date Pricing • 📊 Market Capitalization &amp; Valuation • 🌟 Star-Sorted Repositories
    </text>
  </g>
</svg>
